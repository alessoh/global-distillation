<!doctype html><html><head><meta charset="utf-8">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Newsreader:opsz,wght@6..72,400;6..72,500&family=Schibsted+Grotesk:wght@400;500;600&family=IBM+Plex+Mono:wght@400&display=swap">
<style>
*{box-sizing:border-box;margin:0}
body{width:1200px;height:630px;background:#FAF8F4;color:#1A1814;
  font-family:"Schibsted Grotesk",system-ui,sans-serif;padding:64px 72px;
  display:flex;flex-direction:column;justify-content:space-between;position:relative;overflow:hidden}
.eyebrow{font-family:"IBM Plex Mono",monospace;font-size:17px;letter-spacing:.1em;
  text-transform:uppercase;color:#837C71;display:flex;align-items:center;gap:12px}
.dot{width:9px;height:9px;border-radius:50%;background:#B5451B}
h1{font-family:"Newsreader",Georgia,serif;font-weight:400;font-size:78px;line-height:1.04;
  letter-spacing:-.02em;max-width:16ch;margin-top:26px}
h1 em{font-style:italic;color:#B5451B}
.facts{display:flex;gap:52px;border-top:1px solid #CEC6B6;padding-top:24px}
.fact dt{font-size:15px;color:#837C71;margin-bottom:6px}
.fact dd{font-family:"Newsreader",Georgia,serif;font-size:40px;line-height:1;
  font-variant-numeric:tabular-nums}
.mark{position:absolute;right:-8px;top:132px;width:520px;height:520px;opacity:.5}
.wordmark{font-family:"Newsreader",Georgia,serif;font-size:23px}
.wordmark em{font-style:italic}
</style></head><body>
<svg class="mark" viewBox="0 0 560 560" fill="none" aria-hidden="true">
  <g stroke="#B2AA9D" stroke-width="1">
    <circle cx="150" cy="280" r="128" opacity=".5"/><circle cx="150" cy="280" r="96" opacity=".38"/>
    <circle cx="150" cy="280" r="64" opacity=".26"/>
  </g>
  <g stroke="#B5451B" stroke-width="1.4" opacity=".55">
    <path d="M262 236 C 330 236, 350 262, 402 274"/><path d="M262 280 C 330 280, 350 280, 402 280"/>
    <path d="M262 324 C 330 324, 350 298, 402 286"/>
  </g>
  <circle cx="418" cy="280" r="30" fill="#1F6A99" opacity=".22"/>
  <circle cx="418" cy="280" r="15" fill="#1F6A99" opacity=".5"/>
</svg>
<div>
  <p class="eyebrow"><span class="dot"></span>A public compendium · updated daily</p>
  <h1>How frontier intelligence is <em>compressed, priced,</em> and <em>contested.</em></h1>
</div>
<div>
  <dl class="facts">
    <div class="fact"><dt>Methods catalogued</dt><dd>27</dd></div>
    <div class="fact"><dt>Models compared</dt><dd>74</dd></div>
    <div class="fact"><dt>Dated events</dt><dd>130</dd></div>
    <div class="fact"><dt>Primary sources</dt><dd>599</dd></div>
  </dl>
  <p class="wordmark" style="margin-top:22px">Global <em>Distillation</em></p>
</div>
</body></html>
