# Daily refresh of data/live.json (arXiv, Hugging Face, GitHub, Hacker News signals).
#
# Deployment: there are two supported paths, and the workflow handles both.
#
#   1. Vercel Git integration (preferred, zero secrets). If the Vercel project is
#      connected to this repository in the Vercel dashboard, the push below is
#      enough: Vercel redeploys on every push to main and the deploy step here is
#      skipped automatically because VERCEL_TOKEN is not set.
#
#   2. Token deploy (fallback, used when the Git integration is not connected).
#      Add three repository secrets - VERCEL_TOKEN, VERCEL_ORG_ID and
#      VERCEL_PROJECT_ID - and the deploy step below pushes the refreshed site to
#      production with the Vercel CLI. The org and project ids are in
#      .vercel/project.json; create the token at vercel.com/account/tokens.
name: Daily data refresh

on:
  schedule:
    - cron: "17 6 * * *" # daily at 06:17 UTC
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: daily-update
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    # Job-level env so the deploy step's `if:` can read it. A step cannot test
    # env that it defines itself.
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Fetch live signals
        run: node scripts/update-data.mjs
        env:
          # Raises the GitHub API rate limit for the repo-stats source; optional.
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Commit and push if data/live.json changed
        run: |
          git add data/live.json
          if git diff --cached --quiet; then
            echo "data/live.json unchanged; nothing to commit"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore(data): daily refresh $(date -u +%Y-%m-%d)"
          # With the Git integration connected, this push alone redeploys the site.
          git push origin HEAD:main

      - name: Deploy to Vercel
        # Only runs when the Git integration is not connected and a token is set.
        # `secrets` cannot be read in an `if:` on its own, so it is passed through env.
        if: ${{ env.VERCEL_TOKEN != '' }}
        run: npx --yes vercel@latest deploy --prod --yes --token "$VERCEL_TOKEN"
